# Host nginx vhost → XI GAME compose nginx (127.0.0.1:18130)
# Pattern matches staging.zrhpay.com / account.zrhtech.com (Cloudflare → :80 origin).
# SSL terminates at Cloudflare; origin is HTTP only on this host.
#
# Install (as zrh-admin; reload may require sudo password once):
#   cp deploy/production/host-nginx-www.xibull.com.conf /etc/nginx/sites-available/www.xibull.com
#   ln -sfn /etc/nginx/sites-available/www.xibull.com /etc/nginx/sites-enabled/www.xibull.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name www.xibull.com xibull.com;
    client_max_body_size 20m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
